# Plugin version. CI reads this file directly to name the jar and tag the release, so this
# line is the single source of truth for the version.
version=1.0.0

org.gradle.jvmargs=-Xmx2G
org.gradle.java.installations.auto-detect=true
# Never let Gradle reach out for a JDK: a toolchain downloaded mid-build makes the build
# non-reproducible and depends on a network resolver being up.
org.gradle.java.installations.auto-download=false
# actions/setup-java exports JAVA_HOME_<version>_<arch> for every JDK it installs; pinning the
# toolchain to that env var makes CI toolchain resolution deterministic without a network-facing
# resolver plugin.
org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64
org.gradle.parallel=true
org.gradle.caching=true
