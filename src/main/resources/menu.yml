# ---------------------------------------------------------------------------
# PolaroidHomes — menu layout
#
# This file decides what every menu looks like and where each button sits.
# Both screens are described the same way: a picture of the window drawn with
# characters, plus one entry per character saying what that character is.
#
# --- How a layout works ----------------------------------------------------
#
# `rows` is the picture. One string per row of the window, 1 to 6 rows,
# and every string is exactly 9 characters long — that is the width Minecraft
# gives a chest window, and the plugin refuses a row of any other length.
#
#     rows:
#       - "#########"     row 0, slots 0-8
#       - "#HHHHHHH#"     row 1, slots 9-17
#       - "<###I###>"     row 2, slots 18-26
#
# `elements` says what each character means. The key is the single character,
# and `type` is the behaviour:
#
#     elements:
#       '#': { type: filler, item: BLACK_STAINED_GLASS_PANE }
#       'H': { type: home-slot }
#       '<': { type: previous-page, item: ARROW }
#
# A space is always an empty slot: no item, no click, nothing to declare.
# Use it wherever you want the window to show through.
#
# --- Element types ---------------------------------------------------------
#
# Homes menu:
#   home-slot      where the homes go. Filled in reading order — left to
#                  right, top to bottom — with your homes, then free slots,
#                  then locked slots. At least one is required.
#   previous-page  goes back a page. Drawn only when there is one.
#   next-page      goes forward a page. Drawn only when there is one.
#   info           the counter: homes used, your limit, the page number.
#                  It is a label and does nothing when clicked.
#   close          closes the window.
#   effects        opens the effect catalog. Its lore names whatever the player
#                  currently has equipped, or None. Owner-only: it is drawn in
#                  an admin's view of somebody else's menu but refuses the
#                  click, because an admin looking at a player's homes should
#                  not be one misclick from restyling their teleports.
#   filler         background. Does nothing when clicked, and its tooltip is
#                  hidden, because an empty tooltip box looks broken.
#
# Icon picker:
#   icon-slot      where the icon choices go, the picker's home-slot.
#   previous-page  / next-page  as above.
#   icon-reset     puts the home back on the default icon.
#   icon-back      returns to the homes grid.
#   filler         as above.
#
# Effect picker (the `effects` section):
#   effect-animations  opens the animation list. Its lore counts how many of
#                      that category the player has unlocked, out of the total.
#   effect-particles   opens the particle list, same shape.
#   effect-none        unequips, back to a clean teleport. Drawn as already
#                      current, with no click, when nothing is equipped.
#   effect-back        returns to the homes grid.
#   filler             as above.
#
# Effect list (the `effect-list` section, used for BOTH categories):
#   effect-slot        where one category's entries go, the list's home-slot.
#   previous-page  / next-page  as above.
#   effect-none        as above.
#   effect-back        returns to the effect picker, not to the homes grid.
#   filler             as above.
#
# --- What each element can declare -----------------------------------------
#
#   type                 required. One of the names above.
#   item                 the item to show. Any reference the plugin's item
#                        layer understands (see config.yml's icon-choices for
#                        the full list): a vanilla material, nexo:my_item,
#                        itemsadder:suite:my_item, oraxen:my_item,
#                        headdatabase:12345, head:Notch, texture:<hash>,
#                        basehead:<base64>. A reference that cannot be
#                        resolved — its plugin is missing, or the id is a typo
#                        — falls back to a safe vanilla item and is reported
#                        once in the console. The menu still opens.
#   name                 MiniMessage display name. Leave it out to keep the
#                        name from lang/messages_<language>.yml, which is
#                        where translations live.
#   lore                 MiniMessage lore lines. Leave it out for the same
#                        reason. A `""` line is a blank line.
#   custom-model-data    a number, for a resource pack that keys models off it.
#   glow                 true adds the enchantment glint without enchanting.
#
# Placeholders available in a name or lore: %home%, %world%, %x%, %y%, %z% on
# a home slot; %used%, %limit%, %page%, %pages% on info; %group% on a locked
# slot; %effect% on the effects button and on an effect slot; %unlocked% and
# %total% on a category button.
#
# --- If you break it -------------------------------------------------------
#
# The plugin validates this file on startup and on /homemenu reload. A layout it
# cannot use is reported in the console — naming the row or the key at fault —
# and the built-in layout is used for that screen instead. The plugin keeps
# running and homes keep working; fix the file and run /homemenu reload.
#
# Rejected: more than 6 rows, a row that is not 9 characters, a character with
# no matching element, no home-slot at all, and a layout that needs to page
# (max-displayed-slots is larger than one page of home slots) without both
# paging buttons. Warned about but harmless: an element declared and never
# placed in a row, and paging buttons on a layout that never pages.
#
# --- Reloading -------------------------------------------------------------
#
# /homemenu reload re-reads this file and closes every open menu. A window is
# sized from its layout when it is built, so an already-open window cannot be
# resized in place — the new layout applies to the next one opened.
# ---------------------------------------------------------------------------

# Schema version of this file. The plugin migrates older files forward on
# enable, preserving every value you edited, and backs the original up first.
# Do not edit this by hand.
config-version: 2

# Hard ceiling on how many home slots are drawn across all pages, and the
# reason a misconfigured home limit cannot break the menu. A server that
# defines `sethome-multiple.vip: 9999` would otherwise ask this plugin to
# render 9999 slots. The grid is sized as:
#
#     visibleSlots = min(highest configured rank limit, max-displayed-slots)
#
# It lives here rather than in config.yml because it only means anything next
# to the layout below: if you set it higher than one page of home slots, the
# layout must carry previous-page and next-page buttons, or startup rejects it.
max-displayed-slots: 45

homes:
  rows:
    - "HHHHHHHHH"
    - "HHHHHHHHH"
    - "HHHHHHHHH"
    - "HHHHHHHHH"
    - "HHHHHHHHH"
    - "<##EI###>"
  elements:
    'H':
      type: home-slot
      # No item here: a home draws the icon its owner picked, from the icon
      # store, and config.yml's default-icon when none is picked yet.
    '#':
      type: filler
      item: BLACK_STAINED_GLASS_PANE
    '<':
      type: previous-page
      item: ARROW
      name: "<#f2c42f>ᴘʀᴇᴠɪᴏᴜs ᴘᴀɢᴇ"
      lore:
        - ""
        - "<#95d027>▸ ᴄʟɪᴄᴋ ᴛᴏ ɢᴏ ʙᴀᴄᴋ"
    '>':
      type: next-page
      item: ARROW
      name: "<#f2c42f>ɴᴇxᴛ ᴘᴀɢᴇ"
      lore:
        - ""
        - "<#95d027>▸ ᴄʟɪᴄᴋ ᴛᴏ ɢᴏ ғᴏʀᴡᴀʀᴅ"
    'I':
      type: info
      item: PAPER
      name: "<#289bd0>ʜᴏᴍᴇs <#6f6085>(%used%/%limit%)"
      lore:
        - "<#E9FDFB>Page <#b6c1ec>%page%<#E9FDFB> of <#b6c1ec>%pages%"
        - ""
        - "<#315a7a>Your limit comes from your home plugin."
    'E':
      type: effects
      item: NETHER_STAR
      name: "<#cd80f7>ᴛᴇʟᴇᴘᴏʀᴛ ᴇғғᴇᴄᴛ"
      lore:
        - "<#E9FDFB>Equipped: <#b6c1ec>%effect%"
        - ""
        - "<#95d027>▸ ᴄʟɪᴄᴋ ᴛᴏ ᴄʜᴏᴏsᴇ"
    # A close button is not on the default grid, so that this release draws the
    # same window earlier ones did. To add one, put a character in a row and
    # declare it here, for example:
    #
    #     'X':
    #       type: close
    #       item: BARRIER
    #       name: "<#eb4b30>ᴄʟᴏsᴇ"
    #       lore:
    #         - ""
    #         - "<#95d027>▸ ᴄʟɪᴄᴋ ᴛᴏ ᴄʟᴏsᴇ"

icons:
  rows:
    - "OOOOOOOOO"
    - "OOOOOOOOO"
    - "OOOOOOOOO"
    - "OOOOOOOOO"
    - "OOOOOOOOO"
    - "<##R#B##>"
  elements:
    'O':
      type: icon-slot
      # No item: each slot shows the choice it offers, from config.yml's
      # icon-choices list.
    '#':
      type: filler
      item: BLACK_STAINED_GLASS_PANE
    '<':
      type: previous-page
      item: ARROW
      name: "<#f2c42f>ᴘʀᴇᴠɪᴏᴜs ᴘᴀɢᴇ"
      lore:
        - ""
        - "<#95d027>▸ ᴄʟɪᴄᴋ ᴛᴏ ɢᴏ ʙᴀᴄᴋ"
    '>':
      type: next-page
      item: ARROW
      name: "<#f2c42f>ɴᴇxᴛ ᴘᴀɢᴇ"
      lore:
        - ""
        - "<#95d027>▸ ᴄʟɪᴄᴋ ᴛᴏ ɢᴏ ғᴏʀᴡᴀʀᴅ"
    'R':
      type: icon-reset
      item: BARRIER
      name: "<#f2c42f>ʀᴇsᴇᴛ ɪᴄᴏɴ"
      lore:
        - "<#E9FDFB>Go back to the default icon."
        - ""
        - "<#95d027>▸ ᴄʟɪᴄᴋ ᴛᴏ ʀᴇsᴇᴛ"
    'B':
      type: icon-back
      item: ARROW
      name: "<#f2c42f>ʙᴀᴄᴋ"
      lore:
        - ""
        - "<#95d027>▸ ᴄʟɪᴄᴋ ᴛᴏ ɢᴏ ʙᴀᴄᴋ"

# --- The effect picker -------------------------------------------------------
#
# Two buttons, one per category. Three rows rather than six on purpose: the
# window holds four things, and a six-row window of filler around them reads as
# a screen that failed to load.
effects:
  rows:
    - "#########"
    - "###A#P###"
    - "###N#B###"
  elements:
    '#':
      type: filler
      item: BLACK_STAINED_GLASS_PANE
    'A':
      type: effect-animations
      item: BLAZE_POWDER
      name: "<#cd80f7>ᴀɴɪᴍᴀᴛɪᴏɴs"
      lore:
        - "<#E9FDFB>Unlocked <#b6c1ec>%unlocked%<#E9FDFB> of <#b6c1ec>%total%"
        - ""
        - "<#95d027>▸ ᴄʟɪᴄᴋ ᴛᴏ ʙʀᴏwsᴇ"
    'P':
      type: effect-particles
      item: FIREWORK_STAR
      name: "<#22e8bc>ᴘᴀʀᴛɪᴄʟᴇs"
      lore:
        - "<#E9FDFB>Unlocked <#b6c1ec>%unlocked%<#E9FDFB> of <#b6c1ec>%total%"
        - ""
        - "<#95d027>▸ ᴄʟɪᴄᴋ ᴛᴏ ʙʀᴏwsᴇ"
    'N':
      type: effect-none
      item: BARRIER
    'B':
      type: effect-back
      item: ARROW

# --- One category's list -----------------------------------------------------
#
# Used for BOTH categories. Two layouts would be two things to keep in step for
# no gain, and a menu that changes shape halfway through reads as a bug.
effect-list:
  rows:
    - "EEEEEEEEE"
    - "EEEEEEEEE"
    - "EEEEEEEEE"
    - "EEEEEEEEE"
    - "<##N#B##>"
  elements:
    'E':
      type: effect-slot
      # No item: each slot shows the icon its own catalog entry declares, or the
      # locked-slot-icon from config.yml when the player has not unlocked it.
    '#':
      type: filler
      item: BLACK_STAINED_GLASS_PANE
    '<':
      type: previous-page
      item: ARROW
      name: "<#f2c42f>ᴘʀᴇᴠɪᴏᴜs ᴘᴀɢᴇ"
      lore:
        - ""
        - "<#95d027>▸ ᴄʟɪᴄᴋ ᴛᴏ ɢᴏ ʙᴀᴄᴋ"
    '>':
      type: next-page
      item: ARROW
      name: "<#f2c42f>ɴᴇxᴛ ᴘᴀɢᴇ"
      lore:
        - ""
        - "<#95d027>▸ ᴄʟɪᴄᴋ ᴛᴏ ɢᴏ ꜰᴏʀwᴀʀᴅ"
    'N':
      type: effect-none
      item: BARRIER
    'B':
      type: effect-back
      item: ARROW
