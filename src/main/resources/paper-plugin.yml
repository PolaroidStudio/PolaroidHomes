name: PolaroidHomes
version: '${version}'
main: me.juancayc.polaroidhomes.PolaroidHomesPlugin
# Paper ignores Spigot's `libraries:` key entirely. The JDBC drivers and the pool are
# fetched by this loader instead, which is the only mechanism Paper honours.
loader: me.juancayc.polaroidhomes.PluginLibraryLoader
description: A custom-icon homes GUI with teleport effects, for EssentialsX or HuskHomes.
author: juancayc
website: https://github.com/PolaroidStudio/PolaroidHomes

# Minimum Paper API this plugin requires. This is a FLOOR, not a ceiling: a server whose
# api-version is below this refuses to load the plugin, but any server at or above it
# (including the year.release line, e.g. 26.2) loads it fine.
api-version: '1.21'

# Teleport effects spawn and remove a marker entity in the destination region. Every one of
# those calls is routed through the region scheduler, so the plugin is region-thread correct.
folia-supported: true

dependencies:
  server:
    # Both home providers are OPTIONAL, and exactly one of them is needed. Neither can be
    # required: an EssentialsX-only server and a HuskHomes-only server are both valid, and a
    # required dependency would refuse to load on the other one. The plugin checks for itself
    # at enable and disables itself when NO provider is present — see
    # PolaroidHomesPlugin#selectProvider(). BEFORE on both so whichever is installed has
    # registered its API before this plugin reads it.
    Essentials:
      load: BEFORE
      required: false
      join-classpath: true
    HuskHomes:
      load: BEFORE
      required: false
      join-classpath: true
    ModelEngine:
      load: BEFORE
      required: false
      join-classpath: true
    Nexo:
      load: BEFORE
      required: false
      join-classpath: true
    ItemsAdder:
      load: BEFORE
      required: false
      join-classpath: true
    Oraxen:
      load: BEFORE
      required: false
      join-classpath: true
    HeadDatabase:
      load: BEFORE
      required: false
      join-classpath: true

# No `commands:` section, deliberately: Paper plugins do not support YAML command declarations.
# /homemenu, its aliases and its description are registered in code through the COMMANDS lifecycle
# event — see PolaroidHomesPlugin#registerCommand(). Declaring them here would be silently ignored
# and getCommand() would throw on enable.
#
# /homes and /home are NOT registered anywhere, on purpose: both backends already own them and load
# first, so a registration would lose the race silently. They are reached by interception instead —
# see commands.intercept in config.yml and CommandInterceptListener.

permissions:
  polaroidhomes.use:
    description: Open the homes menu and teleport from it.
    default: true
  polaroidhomes.icon:
    description: Change the icon of your own homes.
    default: true
  polaroidhomes.rename:
    description: Rename your own homes from the menu.
    default: true
  polaroidhomes.delete:
    description: Delete your own homes from the menu, with a confirmation click.
    default: true
  polaroidhomes.admin:
    description: Reload the configuration and open another player's menu.
    default: op
