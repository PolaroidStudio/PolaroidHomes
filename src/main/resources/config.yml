# ---------------------------------------------------------------------------
# PolaroidHomes
#
# Another plugin owns the homes and the home limits: this one reads them. It
# never stores a limit and never grants one. Whichever home plugin is in use
# resolves the limit from its own configuration and permissions, so to give a
# rank more homes, edit that plugin's config, not this one.
#
# PolaroidHomes owns exactly two things: the icon chosen for each home, and the
# effect played when a home teleport starts and arrives.
# ---------------------------------------------------------------------------

# Schema version of this file. The plugin migrates older files forward on enable,
# preserving every value you edited, and backs the original up first. Do not edit
# this by hand: lowering it re-runs migrations, raising it makes the plugin refuse
# to touch the file.
config-version: 6

# Language file loaded from lang/messages_<language>.yml. Any key missing from
# that file falls back to the English one shipped inside the jar, so a partial
# translation never shows a raw key to a player.
language: en

hooks:
  # Which plugin owns the homes this menu shows.
  #
  #   auto          use whichever supported plugin is installed. If both are,
  #                 EssentialsX wins, because it was this plugin's only backend
  #                 before this option existed and your stored icons were
  #                 recorded against its home names.
  #   essentialsx   EssentialsX
  #   huskhomes     HuskHomes
  #
  # Naming a plugin that is not installed is an error, not a fallback: the
  # plugin says so in the console and refuses to enable rather than quietly
  # reading an empty home list from a different backend. With no supported
  # plugin installed at all it also refuses to enable, because there is nothing
  # for it to show.
  #
  # Not every backend supports everything. EssentialsX can name the rank that
  # unlocks a locked slot and can have its teleport warmup stretched to fit the
  # entry animation; HuskHomes can do neither, so a locked slot there simply
  # reads as locked and the animation plays alongside HuskHomes' own warmup.
  home-provider: auto

# ---------------------------------------------------------------------------
# Commands
#
# This plugin registers /homemenu and its aliases (phomes, homesmenu, hmenu).
# It deliberately does NOT register /homes or /home: whichever home plugin you
# run already owns both, and it loads first, so a registration here would lose
# the race silently — players would type /homes, the backend would answer, and
# this menu would never open. That was a real bug in an earlier release.
#
# Interception is the honest way to get the standard name. The typed line is
# caught before the backend sees it, and only then is the menu opened instead.
# Turn it off and /homemenu still works, so the plugin is never unreachable.
# ---------------------------------------------------------------------------
commands:
  intercept:
    # /homes opens this menu instead of the backend's home list. On by default:
    # a list of your homes is what this plugin draws, so answering /homes with
    # the picture rather than the text is the whole point.
    homes: true

    # /home opens this menu instead of teleporting. OFF by default, and you
    # should think hard before turning it on: /home <name> is the most-run
    # command on most servers, and while an argument is NEVER swallowed — see
    # below — a player who types a bare /home expecting their default home
    # would get a menu instead of a teleport.
    home: false

  # --- What "intercepted" means, exactly -------------------------------------
  #
  # Only the BARE command is ever swallowed. /homes opens the menu;
  # /homes someplayer does not, because that form belongs to the backend
  # (it is HuskHomes' own /homelist <player>). Same for /home <name>, which
  # keeps teleporting no matter what you set above.
  #
  # Matching ignores case and a leading slash. A namespaced form is never
  # intercepted: /essentials:homes is a player naming the plugin they want,
  # and answering that with a different plugin's menu would be dishonest.
  #
  # Adding another label here does nothing — only the two above are read.

# Where the menus are laid out: which rows exist, which slot holds which
# button, and how each button looks. That all lives in menu.yml, together with
# max-displayed-slots, which only means anything relative to a layout. Row
# count is no longer a number here — it is how many row strings menu.yml
# declares.

gui:
  # Played once for any click that does something. Buttons that do nothing stay
  # silent on purpose — a sound per click turns a menu into a slot machine.
  # Set to '' to disable sound entirely.
  click-sound: UI_BUTTON_CLICK
  click-sound-volume: 0.6
  click-sound-pitch: 1.2

  # Item shown for a home that has no icon chosen yet.
  default-icon: LIGHT_BLUE_BED

  # Item shown for an empty slot the player has already unlocked. Clicking it
  # suggests /sethome in chat.
  empty-slot-icon: LIME_STAINED_GLASS_PANE

  # Item shown for a slot the player has not unlocked. With EssentialsX its lore
  # names the first group whose limit would cover that slot; with HuskHomes,
  # which has no enumerable ranks, it just reads as locked.
  locked-slot-icon: IRON_BARS

  # Filler behind everything. hide-tooltip matters: an empty tooltip box
  # trailing the cursor looks broken.
  filler-icon: BLACK_STAINED_GLASS_PANE

  # Icons offered in the icon picker. Each entry is an item reference resolved
  # by the item layer, which accepts either separator (`prefix:id` or
  # `prefix-id`):
  #
  #   DIAMOND_BLOCK            a vanilla material
  #   nexo:my_item             Nexo
  #   itemsadder:suite:my_item ItemsAdder
  #   oraxen:my_item           Oraxen
  #   headdatabase:12345       HeadDatabase
  #   head:Notch               a player's head, no dependency
  #   texture:<hash>           a head from a textures.minecraft.net hash
  #   basehead:<base64>        a head from a raw base64 textures value
  #
  # A reference whose plugin is not installed, or whose id does not exist,
  # simply does not appear in the picker. It is never an error.
  icon-choices:
    - LIGHT_BLUE_BED
    - RED_BED
    - YELLOW_BED
    - GREEN_BED
    - PURPLE_BED
    - OAK_DOOR
    - CRAFTING_TABLE
    - FURNACE
    - CHEST
    - ENDER_CHEST
    - ANVIL
    - BREWING_STAND
    - ENCHANTING_TABLE
    - BEACON
    - LANTERN
    - CAMPFIRE
    - BOOKSHELF
    - FLOWER_POT
    - DIAMOND_BLOCK
    - EMERALD_BLOCK
    - GOLD_BLOCK
    - NETHERITE_BLOCK
    - GRASS_BLOCK
    - SAND
    - SNOW_BLOCK
    - ICE
    - NETHERRACK
    - END_STONE
    - WATER_BUCKET
    - LAVA_BUCKET
    - COMPASS
    - CLOCK
    - MAP
    - PAINTING
    - ITEM_FRAME
    - TORCH

teleport-effects:
  # --- What this section is now -----------------------------------------------
  #
  # A CATALOG of effects players unlock and equip, not one effect for everybody.
  #
  # Each entry below is a product. A player equips exactly ONE of them, from
  # either category, and that one plays on their teleports. A player who has
  # equipped nothing gets a completely clean teleport: no model, no particles,
  # no extra warmup. There is no default effect and no "everyone gets this one"
  # setting — that is the whole point of the change.
  #
  # --- How a player gets one --------------------------------------------------
  #
  # By holding the permission node generated from the entry's id:
  #
  #     teleport-effects.animations.purple_charge  ->  polaroidhomes.animation.purple_charge
  #     teleport-effects.particles.portal          ->  polaroidhomes.particle.portal
  #
  # You never write those nodes here. They are derived from the id, so they
  # cannot drift out of step with the catalog. Sell or grant them from whatever
  # you already use — a shop plugin, a rank, a crate. This plugin has no economy
  # code and never asks who paid for what; it only asks whether the permission
  # is held right now.
  #
  # An id may contain lowercase letters, numbers, `_` and `-` only, because it
  # becomes a permission node. Anything else is rejected with a console message.
  #
  # Losing the permission does NOT clear what a player equipped. The effect just
  # stops playing, and it starts again by itself if the rank comes back. Nobody
  # has to re-equip anything after a renewal.
  #
  # --- The two categories -----------------------------------------------------
  #
  #   animations   a Model Engine model plus animation. Needs Model Engine.
  #   particles    vanilla particles. Needs nothing.
  #
  # An entry declares BOTH its `entry` (departure) and its `arrival`, because a
  # teleport effect is authored as a pair: a charge-up that builds and a landing
  # that resolves. Letting one effect's departure meet another's arrival would
  # produce a teleport that starts as one thing and lands as another, and it
  # would be a product you could not describe in a shop with one line.
  #
  # If Model Engine is NOT installed, every entry under `animations` is treated
  # as UNAVAILABLE: hidden from the effect menu, never playable, even for a
  # player who already holds its permission. It is not "silently plays nothing",
  # because a player who bought a visible, equippable effect and then sees
  # nothing cannot tell a missing dependency from a bug — and would open a
  # ticket about it. The plugin says so loudly in the console at startup so the
  # shortfall is yours to notice, not theirs.
  #
  # --- Where effects apply ----------------------------------------------------

  # Decorate home teleports.
  homes: true

  # Decorate an accepted /tpa. Only the player who travels is decorated, so a
  # /tpahere is never decorated at all: that direction moves the other player,
  # and the effect follows whoever is actually moving.
  tpa: false

  # --- Warmup ------------------------------------------------------------------
  #
  # With EssentialsX, the teleport warmup is stretched to the equipped entry's
  # declared duration so the departure always finishes before the player moves.
  # That now VARIES PER PLAYER: a player wearing a 3-second animation waits
  # three seconds, a player wearing a particle effect gets no stretch at all
  # (particles are drawn in one burst — there is nothing to wait for), and a
  # player wearing nothing keeps exactly the warmup EssentialsX was configured
  # with. The warmup is only ever EXTENDED, never shortened, so your own
  # configured delay is still the floor for everyone.
  #
  # HuskHomes does not allow its warmup to be changed at all — it comes from the
  # player's huskhomes.teleport_warmup.<n> permission and there is no setter —
  # so there the effect simply plays alongside whatever warmup is configured. If
  # you want animations to finish on HuskHomes, set its warmup to at least the
  # longest `duration` in your catalog, and keep your animation durations close
  # together so the shorter ones do not leave players standing around.
  #
  # --- Why duration is declared and not detected -------------------------------
  #
  # Model Engine's AnimationHandler.playAnimation(...) does not return the
  # animation's length, and the API exposes no duration getter anywhere. The
  # only runtime signal is hasFinishedAllAnimations(), which can only be polled
  # after the fact. So the number you put here is what the plugin uses to time
  # the effect and to stretch the warmup.
  # ---------------------------------------------------------------------------

  animations:
    purple_charge:
      # Shown on the menu button. MiniMessage, so gradients and hex work.
      display-name: "<#cd80f7>ᴄᴀʀɢᴀ ᴠɪᴏʟᴇᴛᴀ"
      # The menu button's item. Any reference the item layer understands, so
      # nexo:, itemsadder:, oraxen:, head: and the rest all work here — see
      # gui.icon-choices above for the full list.
      icon: AMETHYST_SHARD
      entry:
        model: ac_vfx_teleport_charge_purple
        animation: teleport_charge_origin
        # Seconds. Also the teleport warmup on EssentialsX, see above.
        duration: 3.0
      arrival:
        model: ac_vfx_teleport_charge_purple
        animation: teleport_charge_destination
        duration: 3.0

  particles:
    portal:
      display-name: "<#289bd0>ᴘᴏʀᴛᴀʟ"
      icon: ENDER_PEARL
      entry:
        # A vanilla particle name. Names change between Minecraft releases, and
        # one this version does not have is rejected with a console message
        # rather than quietly swapped for another — a product that does not look
        # like its name is worse than one that is missing.
        particle: PORTAL
        # How many particles the helix draws. Must be positive.
        count: 120
        # Radius in blocks of the helix drawn around the player.
        radius: 1.0
      arrival:
        particle: END_ROD
        count: 80
        radius: 1.0

    flame:
      display-name: "<#f3842c>ʟʟᴀᴍᴀ"
      icon: BLAZE_POWDER
      entry:
        particle: FLAME
        count: 100
        radius: 0.8
      arrival:
        particle: LAVA
        count: 60
        radius: 0.8

  # Safety ceiling, in seconds, for how long a Model Engine marker entity may
  # live before it is removed regardless of the animation state. A marker that
  # outlives its animation is a ghost entity that accumulates until restart.
  max-effect-seconds: 10.0
icons:
  # How often, in seconds, pending icon changes are written to the database.
  # Icons are also flushed on disable, so nothing is lost on a clean shutdown.
  #
  # Which database that is — sqlite or mysql — is configured in data.yml, not
  # here. Backend settings are deliberately kept out of this file so that
  # reloading the GUI configuration can never imply reopening a connection pool.
  save-interval-seconds: 120

# ---------------------------------------------------------------------------
# Blocked worlds
#
# Homes are not allowed in the worlds listed here. This is enforced in two
# places, because a blacklist that only stops new homes leaves every home made
# before you added the world still working:
#
#   Creating   the backend's own home-creation event is cancelled, so it does
#              not matter how the home was made — /sethome, another plugin, or
#              an API call all hit the same event. The player is told which
#              world is blocked.
#
#   Existing   a home already in a blocked world still appears in the menu, so
#              the player can see it and act on it, but it is drawn as
#              unavailable and teleporting to it is refused. Its lore tells the
#              player to delete it, which the menu itself can do.
#
# Matching ignores case. A name that matches no loaded world is kept and simply
# never matches: you may blacklist a world before creating it, or leave an
# entry behind after deleting one, and neither is an error.
# ---------------------------------------------------------------------------
worlds:
  # Example. An empty list means every world is allowed, which is the default.
  blacklist: []
