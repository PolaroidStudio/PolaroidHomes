version: 3
# Schema version of this file, migrated forward automatically on enable. Do not edit by hand.
config-version: 3
# Base language file. Copy to messages_<lang>.yml to translate.
# Missing keys fall back to this file automatically (setDefaults), so a partial translation
# never shows a raw key to a player. Keep this file complete.
#
# All text is MiniMessage: https://docs.advntr.dev/minimessage/format.html
# A key is EITHER a plain string, OR a {text, hover, click} section.
# Click tokens: [NONE] · [RUN_COMMAND]/[EXECUTE] /cmd · [SUGGEST_COMMAND]/[SUGGEST] /cmd ·
#               [OPEN_URL]/[URL] http... · [COPY] text
# Do NOT put the plugin name, author or version here — those are constants, not translations.
#
# The prefix is composed in code (prefix + message), so never write <prefix> inside a message
# value: nothing resolves that tag and it would print literally.

# The Polaroid banner. The POLAROID gradient is the brand and should not change; the plugin
# name after it is the only part meant to be restyled.
prefix: "<b><#eb4b30>PO</#eb4b30><#f3842c>LA</#f3842c><#f2c42f>RO</#f2c42f><#95d027>ID</#95d027> <#289bd0>HOMES</#289bd0> <#315a7a>┇</b> "

general:
  no_permission: "<#eb4b30>You do not have permission to do this."
  players_only: "<#eb4b30>Only a player can use this command."
  player_not_found: "<#eb4b30>Player <#f2c42f>%player%<#eb4b30> was not found."
  reloaded: "<#95d027>Configuration reloaded."
  provider_missing: "<#eb4b30><#f2c42f>%provider%<#eb4b30> is not available, so homes cannot be read."

homes:
  none: "<#E9FDFB>You have no homes yet. Use <#f2c42f>/sethome <name><#E9FDFB> to set one."
  unknown: "<#eb4b30>You have no home called <#f2c42f>%home%<#eb4b30>."
  teleporting: "<#95d027>Teleporting to <#f2c42f>%home%<#95d027>."
  teleport_failed: "<#eb4b30>The teleport to <#f2c42f>%home%<#eb4b30> could not be completed."
  slot_locked: "<#eb4b30>That slot is locked. It unlocks at <#f2c42f>%group%<#eb4b30>."
  slot_empty:
    text: "<#E9FDFB>That slot is free. Use <#f2c42f>/sethome <name><#E9FDFB> to claim it."
    hover: "<#95d027>▸ ᴄʟɪᴄᴋ ᴛᴏ ᴡʀɪᴛᴇ ᴛʜᴇ ᴄᴏᴍᴍᴀɴᴅ"
    click: "[SUGGEST_COMMAND] /sethome "

rename:
  # Sent when the rename prompt opens. The player types the new name in chat.
  prompt:
    text: "<#E9FDFB>Type the new name for <#f2c42f>%home%<#E9FDFB> in chat, or <#f2c42f>%cancel%<#E9FDFB> to stop."
    hover: "<#315a7a>You have <#E9FDFB>%seconds%<#315a7a> seconds."
  cancelled: "<#315a7a>Rename cancelled. <#f2c42f>%home%<#315a7a> was left alone."
  expired: "<#315a7a>The rename prompt for <#f2c42f>%home%<#315a7a> expired."
  done: "<#95d027><#f2c42f>%home%<#95d027> is now called <#f2c42f>%new%<#95d027>."
  failed: "<#eb4b30><#f2c42f>%home%<#eb4b30> could not be renamed."
  unsupported: "<#eb4b30><#f2c42f>%provider%<#eb4b30> cannot rename a home."
  # One key per rule in HomeNameRules, so the player is told which one they broke.
  invalid_empty: "<#eb4b30>A home name cannot be blank."
  invalid_too_long: "<#eb4b30>That name is too long. The limit is <#f2c42f>%max%<#eb4b30> characters."
  invalid_characters: "<#eb4b30>Use only letters, numbers, <#f2c42f>_<#eb4b30> and <#f2c42f>-<#eb4b30>. A space or a dot would make the home unreachable by command."
  invalid_duplicate: "<#eb4b30>You already have a home called <#f2c42f>%new%<#eb4b30>."
  invalid_unchanged: "<#315a7a><#f2c42f>%home%<#315a7a> already has that name."

delete:
  # The armed state. Deliberately a warning colour, not an error: nothing has gone wrong yet.
  armed: "<#f2c42f>Click again within <#eb4b30>%seconds%s<#f2c42f> to delete <#eb4b30>%home%<#f2c42f>. This cannot be undone."
  done: "<#95d027><#f2c42f>%home%<#95d027> was deleted."
  failed: "<#eb4b30><#f2c42f>%home%<#eb4b30> could not be deleted."
  unsupported: "<#eb4b30><#f2c42f>%provider%<#eb4b30> cannot delete a home."

worlds:
  # The one sentence that has to name the world and say what to do about it.
  blocked_teleport: "<#eb4b30><#f2c42f>%home%<#eb4b30> is in <#f2c42f>%world%<#eb4b30>, which is blocked. Delete it from the menu."
  blocked_create: "<#eb4b30>Homes are not allowed in <#f2c42f>%world%<#eb4b30>."

icons:
  changed: "<#95d027>Icon for <#f2c42f>%home%<#95d027> updated."
  reset: "<#95d027>Icon for <#f2c42f>%home%<#95d027> reset to the default."
  unavailable: "<#eb4b30>That icon is not available on this server."

# --- Teleport effects -------------------------------------------------------
# A player equips exactly one effect, from either category, and equipping one
# replaces whatever they had on. %effect% is the entry's display-name straight
# out of config.yml, so it arrives already coloured.
effects:
  equipped: "<#95d027>Now using <#f2c42f>%effect%<#95d027> on your teleports."
  unequipped: "<#315a7a>Your teleports are back to normal."
  # Sent when a permission lapsed between the window being drawn and the click.
  # Not an accusation: the usual cause is a rank expiring, not a player cheating.
  locked: "<#eb4b30>You do not have <#f2c42f>%effect%<#eb4b30> unlocked."

command:
  header: "<#315a7a>▬▬▬▬▬▬▬▬▬▬▬▬ <#289bd0>ʜᴏᴍᴇs <#315a7a>▬▬▬▬▬▬▬▬▬▬▬▬"
  help_open:
    text: "<#f2c42f>▸ <#E9FDFB>/homemenu <#315a7a>— open your homes menu"
    hover: "<#315a7a>Permission: <#E9FDFB>polaroidhomes.use"
    click: "[RUN_COMMAND] /homemenu"
  help_reload:
    text: "<#f2c42f>▸ <#E9FDFB>/homemenu reload <#315a7a>— reload the configuration"
    hover: "<#315a7a>Permission: <#E9FDFB>polaroidhomes.admin"
    click: "[SUGGEST_COMMAND] /homemenu reload"
  help_open_other:
    text: "<#f2c42f>▸ <#E9FDFB>/homemenu <player> <#315a7a>— open another player's menu"
    hover: "<#315a7a>Permission: <#E9FDFB>polaroidhomes.admin"
    click: "[SUGGEST_COMMAND] /homemenu "

# --- Menu text -------------------------------------------------------------
# Titles are dark grey and bold on purpose: a title is a label on the window,
# not a place to be loud.
menu:
  homes:
    title: "<dark_gray><b>ʏᴏᴜʀ ʜᴏᴍᴇs"
    # Title used when an admin opens somebody else's menu.
    title_other: "<dark_gray><b>%player%'s ʜᴏᴍᴇs"
    home:
      name: "<#289bd0>%home%"
      lore:
        - "<#95d027> • ᴡᴏʀʟᴅ: <#E9FDFB>%world%"
        - "<#cd80f7> • x: <#E9FDFB>%x% <#cd80f7>ʏ: <#E9FDFB>%y% <#cd80f7>ᴢ: <#E9FDFB>%z%"
        - ""
        - "<#95d027>▸ ʟᴇғᴛ-ᴄʟɪᴄᴋ ᴛᴏ ᴛᴇʟᴇᴘᴏʀᴛ"
        - "<#95d027>▸ ʀɪɢʜᴛ-ᴄʟɪᴄᴋ ᴛᴏ ʀᴇɴᴀᴍᴇ"
        - "<#95d027>▸ sʜɪғᴛ-ᴄʟɪᴄᴋ ᴛᴏ ᴄʜᴀɴɢᴇ ɪᴄᴏɴ"
        - "<#95d027>▸ ᴅʀᴏᴘ (ǫ) ᴛᴏ ᴅᴇʟᴇᴛᴇ"
    # Drawn instead of `home` when a delete is armed on this home. Red, because the next
    # click is destructive — this is the one home button that has earned the error colour.
    home_armed:
      name: "<#eb4b30>%home%"
      lore:
        - "<#E9FDFB>Press drop again to delete this home."
        - "<#E9FDFB>This cannot be undone."
        - ""
        - "<#eb4b30>▸ ᴅʀᴏᴘ (ǫ) ᴀɢᴀɪɴ ᴛᴏ ᴅᴇʟᴇᴛᴇ"
        - "<#95d027>▸ ᴀɴʏ ᴏᴛʜᴇʀ ᴄʟɪᴄᴋ ᴛᴏ sᴛᴏᴘ"
    # Drawn instead of `home` when the home sits in a blocked world. The home is real and
    # still listed — hiding it would leave the player unable to act on the problem — but
    # teleporting to it is refused, so the only action offered is the one that resolves it.
    home_blocked:
      name: "<#9b336e>%home%"
      lore:
        - "<#eb4b30> • ᴡᴏʀʟᴅ: <#E9FDFB>%world% <#eb4b30>(ʙʟᴏᴄᴋᴇᴅ)"
        - ""
        - "<#E9FDFB>This world is blocked, so this home"
        - "<#E9FDFB>cannot be used. Delete it."
        - ""
        - "<#eb4b30>▸ ᴅʀᴏᴘ (ǫ) ᴛᴏ ᴅᴇʟᴇᴛᴇ"
        - "<#95d027>▸ sʜɪғᴛ-ᴄʟɪᴄᴋ ᴛᴏ ᴄʜᴀɴɢᴇ ɪᴄᴏɴ"
    empty:
      name: "<#f2c42f>ғʀᴇᴇ sʟᴏᴛ"
      lore:
        - "<#E9FDFB>Nothing is set here yet."
        - ""
        - "<#95d027>▸ ᴄʟɪᴄᴋ ᴛᴏ sᴇᴛ ᴀ ʜᴏᴍᴇ"
    # Shown when the home plugin can name the rank that unlocks the slot.
    locked:
      name: "<#9b336e>ʟᴏᴄᴋᴇᴅ sʟᴏᴛ"
      lore:
        - "<#E9FDFB>Unlocks at <#b6c1ec>%group%"
        - ""
        - "<#315a7a>Ranks are managed by your home plugin."
    # Shown instead when the home plugin has no ranks to name — HuskHomes resolves a
    # limit from numeric permissions and keeps no list of the ranks granting them.
    # Do not add %group% here: there is no value to put in it.
    locked_unattributed:
      name: "<#9b336e>ʟᴏᴄᴋᴇᴅ sʟᴏᴛ"
      lore:
        - "<#E9FDFB>You have not unlocked this slot."
        - ""
        - "<#315a7a>Home limits are managed by your home plugin."
    filler:
      name: ""
    previous_page:
      name: "<#f2c42f>ᴘʀᴇᴠɪᴏᴜs ᴘᴀɢᴇ"
      lore:
        - ""
        - "<#95d027>▸ ᴄʟɪᴄᴋ ᴛᴏ ɢᴏ ʙᴀᴄᴋ"
    next_page:
      name: "<#f2c42f>ɴᴇxᴛ ᴘᴀɢᴇ"
      lore:
        - ""
        - "<#95d027>▸ ᴄʟɪᴄᴋ ᴛᴏ ɢᴏ ғᴏʀᴡᴀʀᴅ"
    close:
      name: "<#eb4b30>ᴄʟᴏsᴇ"
      lore:
        - ""
        - "<#95d027>▸ ᴄʟɪᴄᴋ ᴛᴏ ᴄʟᴏsᴇ"
    info:
      name: "<#289bd0>ʜᴏᴍᴇs <#6f6085>(%used%/%limit%)"
      lore:
        - "<#E9FDFB>Page <#b6c1ec>%page%<#E9FDFB> of <#b6c1ec>%pages%"
        - ""
        - "<#315a7a>Your limit comes from your home plugin."
    # The button that opens the effect catalog. %effect% is what will actually
    # play, so an effect a player equipped but no longer has the permission for
    # reads as None here rather than as still active.
    effects:
      name: "<#cd80f7>ᴛᴇʟᴇᴘᴏʀᴛ ᴇғғᴇᴄᴛ"
      lore:
        - "<#E9FDFB>Equipped: <#b6c1ec>%effect%"
        - ""
        - "<#95d027>▸ ᴄʟɪᴄᴋ ᴛᴏ ᴄʜᴏᴏsᴇ"
  icons:
    title: "<dark_gray><b>ɪᴄᴏɴ ғᴏʀ %home%"
    choice:
      name: "<#22e8bc>ᴄʜᴏᴏsᴇ"
      lore:
        - ""
        - "<#95d027>▸ ᴄʟɪᴄᴋ ᴛᴏ ᴜsᴇ ᴛʜɪs ɪᴄᴏɴ"
    selected:
      name: "<#95d027>ɪɴ ᴜsᴇ"
      lore:
        - "<#E9FDFB>This is the current icon."
    reset:
      name: "<#f2c42f>ʀᴇsᴇᴛ ɪᴄᴏɴ"
      lore:
        - "<#E9FDFB>Go back to the default icon."
        - ""
        - "<#95d027>▸ ᴄʟɪᴄᴋ ᴛᴏ ʀᴇsᴇᴛ"
    back:
      name: "<#f2c42f>ʙᴀᴄᴋ"
      lore:
        - ""
        - "<#95d027>▸ ᴄʟɪᴄᴋ ᴛᴏ ɢᴏ ʙᴀᴄᴋ"
  # --- The effect catalog ---------------------------------------------------
  # Two windows: a category picker, and one list used for both categories.
  effects:
    title: "<dark_gray><b>ᴛᴇʟᴇᴘᴏʀᴛ ᴇғғᴇᴄᴛs"
    animations:
      title: "<dark_gray><b>ᴀɴɪᴍᴀᴛɪᴏɴs"
      name: "<#cd80f7>ᴀɴɪᴍᴀᴛɪᴏɴs"
      lore:
        - "<#E9FDFB>Unlocked <#b6c1ec>%unlocked%<#E9FDFB> of <#b6c1ec>%total%"
        - ""
        - "<#95d027>▸ ᴄʟɪᴄᴋ ᴛᴏ ʙʀᴏᴡsᴇ"
    particles:
      title: "<dark_gray><b>ᴘᴀʀᴛɪᴄʟᴇs"
      name: "<#22e8bc>ᴘᴀʀᴛɪᴄʟᴇs"
      lore:
        - "<#E9FDFB>Unlocked <#b6c1ec>%unlocked%<#E9FDFB> of <#b6c1ec>%total%"
        - ""
        - "<#95d027>▸ ᴄʟɪᴄᴋ ᴛᴏ ʙʀᴏᴡsᴇ"
    # An entry the player has unlocked but is not wearing.
    entry:
      name: "%effect%"
      lore:
        - ""
        - "<#95d027>▸ ᴄʟɪᴄᴋ ᴛᴏ ᴇǫᴜɪᴘ"
    # The one they are wearing. Also drawn with the enchantment glint.
    entry_equipped:
      name: "%effect%"
      lore:
        - "<#95d027>This is your current effect."
        - ""
        - "<#95d027>▸ ᴄʟɪᴄᴋ ᴛᴏ ᴜɴᴇǫᴜɪᴘ"
    # An entry they have not unlocked. No price is named here on purpose: this
    # plugin knows only whether a permission is held, not what it costs or where
    # it is sold, and a menu quoting a stale price is worse than one quoting
    # none. Say where yours are sold if you want that written down.
    entry_locked:
      name: "<#9b336e>%effect%"
      lore:
        - "<#eb4b30> • ʟᴏᴄᴋᴇᴅ"
        - ""
        - "<#315a7a>You have not unlocked this effect."
    none:
      name: "<#f2c42f>ɴᴏ ᴇғғᴇᴄᴛ"
      lore:
        - "<#E9FDFB>Teleport with nothing at all."
        - ""
        - "<#95d027>▸ ᴄʟɪᴄᴋ ᴛᴏ ᴜɴᴇǫᴜɪᴘ"
    # Drawn instead of `none` when nothing is equipped already, so the button
    # never offers an action that would do nothing.
    none_current:
      name: "<#95d027>ɴᴏ ᴇғғᴇᴄᴛ"
      lore:
        - "<#E9FDFB>Your teleports are already clean."
    back:
      name: "<#f2c42f>ʙᴀᴄᴋ"
      lore:
        - ""
        - "<#95d027>▸ ᴄʟɪᴄᴋ ᴛᴏ ɢᴏ ʙᴀᴄᴋ"

status:
  unlimited: "<#95d027>unlimited"
  none: "<#315a7a>None"
